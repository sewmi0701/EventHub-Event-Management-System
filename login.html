
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>EventHub - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="register-container">

        <!-- LEFT SIDE -->
        <section class="left-side">

            <div class="brand-content">
                <h1>EventHub</h1>
                <p>Join Our<br>Event Community</p>
            </div>

            <!-- PURPLE WAVES -->
            <div class="waves" aria-hidden="true">
                <svg viewBox="0 0 420 190"
                     preserveAspectRatio="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <path d="M0 115 C55 105 85 110 120 140
                             C165 177 200 178 245 148
                             C300 112 335 125 420 165
                             L420 190 L0 190 Z"
                          fill="#DCD8FF"/>

                    <path d="M0 42 C65 10 95 75 125 120
                             C155 169 175 181 225 190
                             L0 190 Z"
                          fill="#80AEF7"/>

                    <path d="M0 82 C60 55 100 130 135 165
                             C150 180 165 187 195 190
                             L0 190 Z"
                          fill="#9689F0"/>

                    <path d="M0 112 C45 90 75 130 105 155
                             C125 174 155 185 175 190
                             L0 190 Z"
                          fill="#6045DF"/>
                </svg>
            </div>

        </section>

        <!-- LOGIN FORM -->
        <section class="right-side">

            <div class="form-content">

                <h2>Login</h2>

                <p class="subtitle">
                    Welcome back! Please login to your account.
                </p>

                <form id="loginForm">

                    <label for="loginEmail">Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            Remember Me
                        </label>

                        <a href="#" id="forgotPassword">
                            Forgot Password?
                        </a>
                    </div>

                    <button type="submit" class="register-btn">
                        Login
                    </button>

                    <p id="loginMessage"
                       class="form-message"
                       role="status"></p>

                </form>

                <p class="login-text">
                    Don't have an account?
                    <a href="index.html">Register</a>
                </p>

            </div>
        </section>

    </main>

    <script>
        
const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    loginMessage.textContent = "Logging in...";
    loginMessage.className = "form-message";

    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const result = await response.json();

        loginMessage.textContent = result.message;

        loginMessage.className = result.success
            ? "form-message success"
            : "form-message error";

        if (result.success) {
            window.location.href = result.redirect;
        }

    } catch (error) {
        loginMessage.textContent =
            "Cannot connect to the server.";

        loginMessage.className = "form-message error";
    }
});

document.getElementById("forgotPassword")
    .addEventListener("click", function(event) {
        event.preventDefault();

        loginMessage.textContent =
            "Password reset will be added later.";
    });

    </script>

</body>
</html>
