
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Ticket | EventHub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3fb;
    color: #202445;
}

header {
    background: #171b4b;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    color: white;
    margin: 0;
}

header a {
    color: white;
    text-decoration: none;
}

main {
    max-width: 850px;
    margin: 45px auto;
    padding: 0 20px;
}

#status {
    text-align: center;
    padding: 25px;
}

.ticket {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(0,0,0,0.10);
}

.ticket-banner {
    height: 270px;
    position: relative;
    background: linear-gradient(135deg, #151945, #6749e8);
    display: flex;
    align-items: flex-end;
    padding: 30px;
    color: white;
    overflow: hidden;
}

.ticket-banner img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.ticket-banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        transparent,
        rgba(12, 15, 42, 0.90)
    );
}

.banner-content {
    position: relative;
    z-index: 1;
}

.banner-content h1 {
    font-size: 30px;
    margin: 10px 0;
}

.event-category {
    background: #6552e8;
    display: inline-block;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
}

.ticket-body {
    padding: 32px;
}

.ticket-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.confirmed {
    background: #dcfce7;
    color: #166534;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.ticket-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    margin: 30px 0;
}

.info-label {
    display: block;
    font-size: 12px;
    color: #7c849d;
    margin-bottom: 8px;
}

.info-value {
    font-size: 16px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.ticket-bottom {
    border-top: 2px dashed #d7daeb;
    padding-top: 22px;
    text-align: center;
}

.ticket-bottom p {
    color: #7c849d;
    font-size: 13px;
}

.actions {
    text-align: center;
    margin-top: 25px;
}

.print-button {
    background: #4935df;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

[hidden] {
    display: none !important;
}

@media(max-width:600px) {
    .ticket-grid {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .ticket-banner {
        height: 220px;
    }

    .banner-content h1 {
        font-size: 24px;
    }

    .ticket-body {
        padding: 22px;
    }
}

@media print {
    body {
        background: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    header, .actions {
        display: none;
    }

    main {
        margin: 0;
        max-width: none;
        padding: 0;
    }

    .ticket {
        box-shadow: none;
        border: 1px solid #ddd;
    }
}

/* Compact EventHub Ticket Design */

main {
    max-width: 580px;
    margin: 25px auto;
}

.ticket-banner {
    height: 160px;
    padding: 20px;
}

.banner-content h1 {
    font-size: 24px;
}

.ticket-body {
    padding: 22px;
}

.ticket-heading h2 {
    font-size: 19px;
    margin: 0;
}

.ticket-grid {
    gap: 15px;
    margin: 20px 0;
}

.info-label {
    font-size: 11px;
    margin-bottom: 5px;
}

.info-value {
    font-size: 14px;
}

.ticket-bottom {
    padding-top: 15px;
}

.actions {
    margin-top: 15px;
}

@media print {
    main {
        max-width: 580px;
        margin: 0 auto;
    }
}

</style>
</head>

<body>

<header>
    <h2>EventHub</h2>
    <a href="/my-bookings.html">← My Bookings</a>
</header>

<main>
    <p id="status">Loading your ticket...</p>

    <section id="ticket" class="ticket" hidden>

        <div class="ticket-banner">
            <img id="eventImage" alt="Event photo" hidden>

            <div class="banner-content">
                <span class="event-category"
                      id="category"></span>
                <h1 id="eventTitle"></h1>
                <p>Official Booking Confirmation</p>
            </div>
        </div>

        <div class="ticket-body">
            <div class="ticket-heading">
                <h2>EVENT TICKET</h2>
                <span class="confirmed">CONFIRMED</span>
            </div>

            <div class="ticket-grid">
                <div>
                    <span class="info-label">PARTICIPANT</span>
                    <span class="info-value" id="participant"></span>
                </div>

                <div>
                    <span class="info-label">BOOKING ID</span>
                    <span class="info-value" id="bookingId"></span>
                </div>

                <div>
                    <span class="info-label">EVENT DATE</span>
                    <span class="info-value" id="eventDate"></span>
                </div>

                <div>
                    <span class="info-label">EVENT TIME</span>
                    <span class="info-value" id="eventTime"></span>
                </div>

                <div>
                    <span class="info-label">LOCATION</span>
                    <span class="info-value" id="location"></span>
                </div>

                <div>
                    <span class="info-label">BOOKING STATUS</span>
                    <span class="info-value">Confirmed</span>
                </div>
            </div>

            <div class="ticket-bottom">
                <h3>EventHub</h3>

<img
    id="ticketQr"
    alt="Event Ticket QR Code"
    style="width:150px; height:150px; display:block; margin:15px auto;"
>

                <p>Keep this booking confirmation for your event.</p>
                <p>Scan this QR code to verify your event ticket.</p>
            </div>
        </div>

    </section>

    <div class="actions" id="actions" hidden>
        <button class="print-button" onclick="window.print()">
            Print / Save as PDF
        </button>
    </div>
</main>

<script>
async function loadTicket() {
    const status = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get("id");

    if (!bookingId || !/^[1-9]\d*$/.test(bookingId)) {
        status.textContent = "Invalid booking ID.";
        return;
    }

    try {
        const [bookingsResponse, authResponse] =
            await Promise.all([
                fetch("/api/my-bookings"),
                fetch("/api/auth/status")
            ]);

        if (!bookingsResponse.ok || !authResponse.ok) {
            throw new Error("Please log in as a participant.");
        }

        const bookingsData = await bookingsResponse.json();
        const authData = await authResponse.json();

        if (!bookingsData.success ||
            !Array.isArray(bookingsData.bookings) ||
            !authData.logged_in ||
            authData.role !== "user") {
            throw new Error("Unable to load your ticket.");
        }

        const booking = bookingsData.bookings.find(
            b => String(b.booking_id) === bookingId
        );

        if (!booking) {
            throw new Error("Booking not found.");
        }

        if (booking.status !== "confirmed") {
            throw new Error(
                "This booking is not confirmed. Ticket unavailable."
            );
        }

        document.getElementById("eventTitle").textContent =
            booking.title;

        document.getElementById("category").textContent =
            booking.category;

        document.getElementById("participant").textContent =
            authData.name || "Participant";

        document.getElementById("bookingId").textContent =
            "#" + booking.booking_id;

        document.getElementById("eventDate").textContent =
            booking.event_date;

        document.getElementById("eventTime").textContent =
            booking.event_time;

        document.getElementById("location").textContent =
            booking.location;

document.getElementById("ticketQr").src =
    `/api/tickets/${booking.booking_id}/qr`;

        if (booking.image_path) {
            const image = document.getElementById("eventImage");

            image.onload = () => {
                image.hidden = false;
            };

            image.onerror = () => {
                image.hidden = true;
            };

            image.src = booking.image_path;
        }

        status.hidden = true;
        document.getElementById("ticket").hidden = false;
        document.getElementById("actions").hidden = false;

    } catch (error) {
        status.textContent = error.message;
    }
}

loadTicket();
</script>

</body>
</html>
